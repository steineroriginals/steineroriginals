    ga: 317
    type: vortrag
    datum: 01.07.1924
    ort: —
    titel: "Die zwei polarisch entgegengesetzten Anordnungen der mensch- lichen Wesensglieder. Spätere Paranoia und schwache Stoffwechsel- organisation bei schwefelarmem Eiweiß, bei schwefelreichem Ei- weiß zu starke Absorption und verschwindende Eindrücke. Grad der Schwefelhaltigkeit bzw. Eisenhaltigkeit; Folgezustände und Be- handlung derselben. Mannigfaltigkeit der Begriffe und Formen und das Entwickeln des Sinnes dafür. Rhythmische Wiederholung als therapeutisches Element. Behandlung der zu Zwangsvorstellungen neigenden Kinder. Diät. Schwer und leicht im Bewegungssystem lebende Kinder und deren Behandlung."
