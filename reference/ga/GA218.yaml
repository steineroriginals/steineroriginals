    datum: 14.10.1922
    ort: Stuttgart
    titel: "Die Schlaferlebnisse des Menschen, ihre geistigen Hintergründe und ihre Bedeutung für das Tagesleben Erkenntnis des «Unbewußten». Schlaf und Traum. Erstes Schlafsta- dium: aus Sich-Unbestimmt-Fühlen Suchen des Geistigen. Folge im Tagwachen: das In-Beziehung-Setzen der Einzeldinge zum Allgemei- nen. - 2. Stadium: aus durch Zersplitterung in einzelne Wesenhaftigkei- ten entstehender Ängstlichkeit zum Durchdrungensein von den planeta- rischen Kräften. Folge im Tagwachen: Erfrischung der Blutzirkulation, des Atmungsprozesses. - 3. Stadium: Erleben der Konstellationen der Fixsterne. Folge: Anfeuerung des Ernährungsprozesses. — Zurückfüh- ren des Menschen durch die drei Stadien zum Erwachen durch die Mondenkräfte."
