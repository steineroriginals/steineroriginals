    reihe: gehalten in Dornach für Eurythmisten und Ärzte
    titel: "Charakter des Vokalischen und Konsonantischen. Sprache und Bewegung in inniger Verbindung in früheren Zeiten und gelockert heute. Das Wieder-in-Bewegung-Bringen des Körpers in der Eurythmie. Das Überführen der einzelnen Vokale aus der Euryth- mie in das Therapeutische: I, U, O, E, A - Armbewegungen und Indikationen für die einzelnen Vokale und das Vokalisieren im Allgemeinen. Beinbewegungen zu den Vokalübungen. Das Sich- innerlich-Abphotographieren als das Wirksame für das therapeuti- sche Konsonantieren. M, S, H im Verhältnis zu Luzifer und Ahriman."
