  - seq: 8
    ga: 69e
    type: vortrag
    datum: 02.01.1913
    ort: Köln
    titel: "Die Erwartungen der Gegenwart an die Naturwissen­ schaft. Ausführungen des Naturwissenschaftlers Profes­ sor von Wettstein. Der Philosoph Moriz Carriere und der Denker aus dem Volk Karl Zeuner - wie dieser zu geistigen Ideen gefunden hat, so kann jeder Suchende zum Verständ­ nis der Geisteswissenschaft kommen. Charles Eliots allge­ meiner Begriff von Geist. Geisteswissenschaft begreift den Geist konkret und wird dadurch lebenspraktisch. Beispiel: Die Anregungen der Schrift «Die Erziehung des Kindes». Die gesundende Wirkung der Geisteswissenschaft. Wahrheiten der Geistesforschung"
