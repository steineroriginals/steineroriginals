  - seq: 3
    ga: 69e
    type: vortrag
    datum: 29.11.1911
    ort: Stuttgart
    titel: "Die Gliederung des menschlichen Wesens, Tod und Wie­ dergeburt, hellseherische Forschung. Wissenschaftliche Einwände gegen Theosophie. Die Widerlegung der Lehre von der Lebenskraft. Die Annahme eines selbstständigen Astrallcibcs als Träger des Bewusstseins ist nicht zwingend. Die wissenschaftliche Erklärung des Schlafzustandes. Ein­ wände gegen Reinkarnation und geistige Erkenntnis. Mo­ ralische Einwände: Theosophie führt zu Fatalismus, zu Lebensfremdheit, zu Egoismus. Eduard von Hartmanns «Philosophie des Unbewussten» und eine anonyme Ge­ genschrift. Wie begründet man Theosophie?"
