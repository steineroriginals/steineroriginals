  - seq: 1
    ga: 152
    type: vortrag
    datum: 01.05.1913
    ort: London
    titel: "Okkulte Wissenschaft und okkulte Entwickelung - Einweihung Die Verbindung zwischen Lebenden und Toten. Der Einfluß der luziferischen und ahrimanischen Impulse. Die Ausbildung eines zu- künftigen physischen Organs für die Erinnerung an frühere Inkarna- tionen. Die okkulte Entwickelung des heutigen Menschen: 1. Aus- bildung der inneren Denkkraft durch Meditation; 2. Durchdrin- gung der Meditation mit der Kraft der Empfindung; 3. Durch- dringung der Meditation mit den Impulsen des Willens."
  - seq: 2
    ga: 152
    type: vortrag
    datum: 02.05.1913
    ort: London
    titel: "Christus zur Zeit des Mysteriums von Golgatha und Christus im zwanzigsten Jahrhundert Die Wesenheit Jehovas. Michael, das «Antlitz Jehovas». Michael und andere Erzengel als Inspiratoren aufeinanderfolgender Zeit- alter. Die Verknüpfung des Christus mit dem Schicksal der Mensch- heit und seine Vereinigung mit der Erdenevolution. Die neue Mi- chael-Offenbarung."
  - seq: 3
    ga: 152
    type: vortrag
    datum: 18.05.1913
    ort: Stuttgart
    titel: Der Michael-Impuls und das Mysterium von Golgatha Das verflossene Gabriel-Zeitalter. Das Michael-Zeitalter seit dem letzten Drittel des 19. Jahrhunderts. Michaels Aufstieg in die Hier- archie der Archai. Das Hineintragen der geistigen Welt in die sinn- liche. Der Michael-Impuls und die anthroposophische Weltanschau- ung.
  - seq: 4
    ga: 152
    type: vortrag
    datum: 20.05.1913
    ort: Stuttgart
    titel: "Naturwissenschaftliches Verständnis im abgelaufenen Gabriel-Zeit- alter. Weckung eines Verständnisses für das Spirituelle im neuen Michael-Zeitalter. Der Herabstieg des Christus auf die Erde, um durch den Tod 2u gehen. Michaels Erhebung vom Sendboten Jah- ves zum Sendboten des Christus, vom Volksgeist zum Zeitgeist."
  - seq: 5
    ga: 152
    type: vortrag
    datum: 14.10.1913
    ort: Kopenhagen
    titel: "Der Weg des Christus durch die Jahrhunderte Die nachatlantische Zeit. Das Wirken des Ätherleibes im urindi- schen, des Empfindungsleibes im urpersischen, der Empfindungs- seele im ägyptisch-chaldäischen, der Verstandes- oder Gemütsseele im griechisch-lateinischen, der Bewußtseinsseele im gegenwärtigen Zeitalter. Die Suche nach dem Christus. Das zukünftige Schauen des Christus in seiner ätherischen Wesenheit. Christus als Berater und Freund der Menschen."
  - seq: 6
    ga: 152
    type: vortrag
    datum: 05.03.1914
    ort: Stuttgart
    titel: "Die drei geistigen Vorstufen des Mysteriums von Golgatha Die dreimalige Verbindung des Christus mit der Menschheit vor dem Mysterium von Golgatha durch dreimaliges Durchdringen des Geistwesens, das später als der nathanische Jesusknabe geboren wurde: zur Regelung der Sinneserfahrung in der lemurischen Zeit; zur Regelung der Lebenskräfte am Anfang der atlantischen Zeit; zur Regelung der Seelenkräfte am Ende der atlantischen Zeit. Das Hereinwirken des Christus-Impulses in die physische Welt und die Menschheitsentwickelung."
  - seq: 7
    ga: 152
    type: vortrag
    datum: 07.03.1914
    ort: Pforzheim
    titel: Der Christus-Impuls im Zeitenwesen und sein Walten im Menschen Die geistige Vorgeschichte des Mysteriums von Golgatha. Drei Vor- stufen. Lemurische Zeit. Anfang der atlantischen Zeit. Ende der atlantischen Zeit. Das Mysterium von Golgatha. Das zukünftige Einfließen des Christus-Impulses in die menschliche Erinnerungs- kraft. Die Abwendung der Gefahr des Chaotischwerdens der Er- innerung durch den Christus-Impuls.
  - seq: 8
    ga: 152
    type: vortrag
    datum: 30.03.1914
    ort: München
    titel: "Der Christus-Geist und seine Beziehungen zur Bewußtseins- entwickelung Die drei Vorstufen des Ereignisses von Golgatha. Die dreimalige Durchgeistigung des Engelwesens, das sich später als der nathani- sche Jesus verkörperte, mit dem Christus-Impuls. Das Wirken des Christus in der menschlichen Geschichte. Konstantin und Maxen- tius. Die Jungfrau von Orleans. Die «Ahasver-Rückschau» im 16. und 17. Jahrhundert. Die anthroposophische Bewegung und die führenden Mächte unserer Zeit."
  - seq: 9
    ga: 152
    type: vortrag
    datum: 27.05.1914
    ort: Paris
    titel: "Der Fortschritt in der Erkenntnis des Christus Das Fünfte Evangelium Die drei Vorstufen des Mysteriums von Golgatha. Die Verkörpe- rung des Christus in Jesus von Nazareth. Drei Epochen in der Ent- wickelung des Jesus von Nazareth, verbunden mit drei großen Schmerzerlebnissen. Das Gespräch des Jesus mit seiner Stief- oder Ziehmutter: das Aushauchen des Zarathustra-Ich. Die Notwendig- keit einer bewußten Christus-Erkenntnis in der Gegenwart und Zukunft."
  - seq: 10
    ga: 152
    type: vortrag
    datum: 01.06.1914
    ort: Basel
    titel: Die vier Christus-Opfer Die drei Vorstufen des Mysteriums von Golgatha Die Notwendigkeit der Gewinnung einer neuen Christus-Erkennt- nis und der Schulung der Selbstlosigkeit. Die Geisteswissenschaft als Schule der Selbstlosigkeit für das intellektuelle und mora- lische Leben der Menschheit. Das wahre Begreifen des Mysteriums von Golgatha.
