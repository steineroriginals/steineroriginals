    titel: "Das Traumleben und die verschiedenen Traumarten an­ hand von Beispielen. Unterschied zwischen Traumbil­ dern und Halluzinationen. Mediumistische Erscheinun­ gen am Beispiel, das Oliver Lodge beschreibt. Das Gebiet des künstlerischen Schaffens. Über den Schulungsweg. Be­ sonderheiten des schauenden Bewusstseins. Bedeutung der Aneignung von Geistesgegenwart. Somnambulismus. Ab­ strakt naturwissenschaftliche und geistige Betrachtung von Mensch und Welt. Der Mensch als Geist- und Seelenwesen. Forschungen vom Gesichtspunkt der Geisteswissenschaft"
