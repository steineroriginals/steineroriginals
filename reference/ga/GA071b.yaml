    titel: "Herman Grimms Charakterisierung von Edward Gibbons Geschichtsbetrachtung. Wachen, Träumen und Schlafen im Menschenleben und das Wirken des Unbewussten in der Geschichte. Geisteswissenschaftliche Geschichtsbetrach­ tung unter Einbeziehung der Scclcncntwicklung. Unter­ schiede bei verschiedenen Völkern. Das «Jüngerwerden» der Menschheit und die Bedeutung des Christusereig- nisses. Verständnis für die Gegenwart durch wahre Ge­ schichtsbetrachtung fühlt zum Ergreifen der Wirklichkeit. Der übersinnliche Mensch und die Fragen der Willensfreiheit und Unsterblichkeit nach Ergebnissen der Geisteswissenschaft"
