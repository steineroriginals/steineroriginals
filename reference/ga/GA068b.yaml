    ort: Nürnberg
    titel: "Von sichtbaren und nicht sichtbaren Welten und der Mög­ lichkeit, diese zu erkennen. Bewusstseinszustände des Menschen: Tagesbewusstsein, Traum und Schlaf. Verän­ derung der drei Bcwusstscinszuständc durch geistige Ent­ wicklung. Das Gewahrwerden der astralischen Welt. Die Sphärenmusik in der geistigen Welt. Besonderheiten der astralischen Welt. Materialismus und Geisteskrankheiten. Das Leben in höheren Welten nach dem Tod. Wie begreift man Krankheit und Tod?"
