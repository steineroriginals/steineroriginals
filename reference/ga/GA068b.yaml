  - seq: 46
    ga: 68b
    type: vortrag
    datum: 17.01.1909
    ort: Pforzheim
    titel: "Die Welt der Wahrnehmung als Ergebnis von Atombewe­ gungen bei Büchner, Vogt, Moleschott und die Konsequen­ zen für die Ansichten über die Seele. Die Atomtheorie. Theo­ sophie und ihre Ansicht von den Sinnesempfindungen als Wirklichkeiten. Du Bois-Keymond über die Unüberbrück­ barkeit der Klult zwischen innerer Empfindung und materi­ ellen Vorgängen im Gehirn. Wilhelm Ostwalds Schritt weg vom Atomismus in Richtung einer Lehre von Kräften. Ant­ worten der Theosophie. Evolution. Mensch und Affe. Die Entdeckung des Radiums und deren Konsequenzen. Ver­ söhnung von Naturwissenschaft und Geisteswissenschaft. Die Naturwissenschaft am Scheidewege"
  - seq: 47
    ga: 68b
    type: vortrag
    datum: 13.02.1909
    ort: Nürnberg
    titel: "Die Geisteswissenschaft bedarf wie die Naturwissen­ schaft der richtigen Instrumente. Durch Entwicklung ist alles entstanden; durch Höherentwicklung der Seele ge­ langt man zu geistigen Wahrnehmungsorganen. Verstehen kann die Geisterkenntnis jeder. Beschreibung der höheren Erkenntnisstufen. Die Imagination und das Rosenkreuz. Läuterung. Erweckung und Erleuchtung. Halluzinationen und Wirklichkeit. Das reine, unbefangene Denken als Vor­ bereitung. Ein Wort Goethes. Die praktische Ausbildung des Denkens"
  - seq: 48
