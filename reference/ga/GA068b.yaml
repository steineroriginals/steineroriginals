    titel: Die Läuterungszeit nach dem Tod. Der weitere Weg der Seele nach dem Tod. Das Leben im Geist und die Vorbe­ reitung des neuen Lebens. Liebe und Freundschaft in der geistigen Welt. Das Wesen des Schlafes und des Todes
