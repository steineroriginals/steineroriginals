    titel: "Verschiedene Auffassungen der Askese: heute, im Mit­ telalter und im alten Griechenland. Theosophisches Ver­ ständnis der Askese als Üben der inneren Kräfte. Innere Kräftigung durch Übungen wie die Roscnkreuzmeditati- on. Blinder Glaube und logische Prüfung der Mitteilungen der Geistesforscher. Gefahren der geistigen Entwicklung. Krankheit durch Disharmonie von Leib, Seele und Geist. Die Mission der Andacht"
