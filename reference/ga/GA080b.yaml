    ort: Solothurn
    titel: "ten Vorstellungen, Seelenleben dadurch objektiv. Imagina­ tion: farbiges Anschauen innerer Bilder. Heraufbringen der Vorstellungen und Wiederwegschaffen der Vorstellungen in mathematischer Klarheit. Inspiration: fortfließendes Pano­ rama. - Liebe als Erkenntniskraft. Erkenntnis für Schick­ salszusammenhänge, von wiederholten Erdenleben. Wal­ dorfschule, Kunstimpuls, religiöses Empfinden. Verständ­ nis des Mysteriums von Golgatha als ein übersinnliches Er­ eignis, des kosmischen Christus. Lebendiger Goethcanis- mus, Goethes Weltanschauung. Die Anthroposophie als Erkenntnis- und Lebensgut"
