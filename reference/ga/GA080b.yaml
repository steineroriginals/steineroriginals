    titel: "schauung wiederholter Erdcnlebcn. Erkraftung des Willens durch denkerisches Nachcrleben der Ergebnisse der intu­ itiven Erkenntnis. Erleben der Liebe als Erkenntniskraft. Impulse durch moralische Intuition. Freiheit. Erleben des Ich. Selbstlosigkeit. Erlebnis des Selbst durch Erleben der Außenwelt in Liebe. Unbewusster Wille. Tatkraft, Akzep­ tanz des Schicksals. Anfeuerung des religiösen und künstle­ rischen Sinnes durch Versenken in Liebe in die Welt — An­ throposophie auf innere Arbeit verweisend, keine Lebens­ regeln, dadurch innere Sicherheit möglich. Die Zeitbedürfnisse und die Anthroposophie Im Rahmen des Hochschulkurses"
