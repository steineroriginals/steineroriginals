  - seq: 2
    ga: 322
    type: vortrag
    datum: 28.09.1920
    ort: —
    titel: Naturwissenschaft vermag nichts für das soziale Leben. Ideal der astronomischen Naturerklärung. Das Ignorabimus Du Bois-Rey- monds gegenüber Materie und Bewußtsein. Bilden und Auflösen von Theorien wie in der Erzählung von Penelope. Notwendigkeit mathe- matisch klarer Begriffe für das Erwachen des Menschen. Er verliert darin sich selbst. Die sozialen Forderungen verlangen ein Hinaus- kommen über das Ignorabimus.
  - seq: 3
    ga: 322
    type: vortrag
    datum: 29.09.1920
    ort: —
    titel: "Hegel. Das Hegeltum vermag nichts für das soziale Leben. Marx und Stirner am Materie- und Bewußtseinspol. Die Durchsichtigkeit der Begriffe genügt nicht, wenn mehr als ein Phänomenalismus gewollt wird. Das Fortrollen mit dem Denken hinter den Sinnesteppich. Goetheanismus als Gegensatz dazu. Primäre und sekundäre Quali- täten als erste Kardinalfrage."
  - seq: 4
    ga: 322
    type: vortrag
    datum: 30.09.1920
    ort: —
    titel: "Der Gegensatz des Bewegungs- und Kräfteparallelogramms in der Mechanik. Woher kommt die Mathematik? Ernstnehmen der Quali- tät der Naturerkenntnis. Lebenssinn, Bewegungssinn, Gleichgewichts- sinn. Darin ist die Mathematik latent. Überwindung ihres prosaisch- abstrakten Auftretens. Novalis. Inspiration. Diese lebt in der Ma- thematik auf einem Teilgebiete. Vedantaphilosophie. Goethes Ver- wandtschaft zur mathematischen Atmosphäre. Er bringt Licht in den Materiepol. Urphänomen und Axiom."
  - seq: 5
    ga: 322
    type: vortrag
    datum: 01.10.1920
    ort: —
    titel: Der Bewußtseinspol. Mystische Erlebnisse und die vergessene «Me- lodie des Leierkastens». Der Weg der «Philosophie der Freiheit». Das reine Denken ergreift an einem Punkt das Weltendasein. Die freien sittlichen Antriebe. Moralische Phantasie. Umwandlung der Begriffe Hegelscher Art in Imagination. Resignation auf das Weiterspinnen der Gedanken. Die Wirklichkeit lebt in Bildern. Das instinktive Ich wird durch die Imagination sozial. Stirner. Verhältnis zur Assozia- tionspsychologie.
