    titel: "Geisteswissenschaftliche Gesichtspunkte zur Entwicklung der Theologie: das verschüttete Geistesleben der ersten vier christli- chen Jahrhunderte. Dionysius Areopagita, Augustinus, die Schola- stik. Das Wirken eines Kollegiums in Italien zur Ausrottung des Initiationsprinzips. Die nach Süden einströmenden nordischen Völker und ihr Verhältnis zum Geistigen, insbesondere zu den Toten. Auserlesene Tote als Hüter des Heiligen Grals, wirkend durch die Ritter des Schwanenordens. Die Lohengrin-Sage. Die mittelalterliche Theologie. Martianus Capeila. Die sieben freien Künste. Die moderne Theologie. Gregor Mendel."
