    type: vortrag
    datum: 06.11.1905
    ort: Berlin
    titel: "Unser Verhalten als Nährboden für Elementarwesen und deren Ent­ wicklung. Den Schmerz vergraben lernen. Die Pflanze schläft, ihr Be­ wusstsein ist außerhalb. Physischer Plan, Astralplan, Mentalplan. Das Tier hat sein Bewusstsein im Astralplan. Naturwesenheiten mit Körper auf dem Astralplan und Bewusstsein auf dem physischen Plan. Der Tod von geistigen Wesenheiten im Verstandesdenken des Menschen. Der Geist der Lüge. Die Vorbereitung einer hellseherischen Kultur als Auf­ gabe der Theosophischen Gesellschaft. Theosophie und Freiheitsbegriff"
