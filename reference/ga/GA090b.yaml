    titel: "Die verschiedenen Bewusstseinszustände des Menschen, die zugehöri­ gen Naturreiche und Planeten. Auf dem Saturn ist die erste Runde, auf der Sonne die zweite Runde und auf dem Mond die dritte Runde für die Entwicklung des Menschen von Bedeutung. Die Entwicklung des Men­ schen durch die Wurzelrassen. Die Erde zwischen Mars und Merkur. Jupiter, Venus, Vulkan. Die Wochentage als Abbild der planetarischen Entwicklung. Die Apokalypse des Johannes II"
