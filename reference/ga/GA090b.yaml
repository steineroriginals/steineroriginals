    type: vortrag
    datum: 09.10.1905
    ort: Berlin
    titel: "Subjektiv - objektiv; Dharma in Karma Berlin, 20. August (1905?) ........................................................ 132 Subjektiv erwacht sein: wirkend, aber nicht wahrnehmend. Objektiv erwacht sein: wirkend und wahrnehmend. Die Entwicklung besteht im fortwährenden Verwandeln des Subjektiven ins Objektive oder des Gesetzes in die Wirklichkeit. Karma ist das in die Materie gekreuzigte Dharma. Dharma ist die Entwicklung im Fortschritt und das Übersein in einem Sein. «Vater* entspricht dem Übersein; «Mutter* entspricht dem sich entwickelnden Wesen; «Sohn* entspricht demjenigen, was aus dem Sein vermöge des Überseins wird. Nirwana als Abwesenheit von Karma, weil ganzes Dharma offenbar. Geisteswissenschaft als Gesundungsquell"
