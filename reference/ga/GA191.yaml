    datum: 12.10.1919
    ort: —
    titel: Die Veranlagungen der Völker. Der Intellektualismus der Euro- päer verhindert die Entwickelung religiöser und wirtschaftlicher Impulse. Abgrund zwischen Wissen und Glauben. Lujo Brentanos oberflächliches Denken. Ökonomische Strömung von Europa nach Amerika. In neuester Zeit in Mitteleuropa Stocken der reli- giösen Strömung aus dem Osten sowie des ökonomischen Stromes nach dem Westen. Neue Gestaltung der Strömungen nur durch Dreigliederung.
