  - seq: 8
    ga: 191
    type: vortrag
    datum: 18.10.1919
    ort: —
    titel: "weder sittliche noch soziale Ideen. Kants Kritiken der «reinen» und der «praktischen» Vernunft als Ausdruck der Kluft zwischen sittlichen Idealen und Sinneserkenntnis. In der heidnischen Kultur waren beide vereint: «Das verlorene Wort.» Die UrWeisheit mußte verlorengehen, um den Menschen die Freiheit zu ermöglichen. Das Mysterium von Golgatha bewahrt die alte Urweisheit und trägt den moralischen Impuls weiter. Seit der Mitte des 15. Jahrhunderts neue Weisheit: Naturwissen ohne Moral. Diese muß durch über- sinnliches Wissen errungen werden, damit soziale Antriebe ent- stehen können. Forschungsmethode und Forschungsresultat in Naturwissenschaft und Geisteswissenschaft. Bequemlichkeit als das Haupthindernis übersinnlicher Erkenntnis."
  - seq: 9
    ga: 191
    type: vortrag
    datum: 19.10.1919
    ort: —
    titel: Neunter Vortrag
  - seq: 10
    ga: 191
    type: vortrag
    datum: 23.10.1919
    ort: —
    titel: "Der Mensch schläft aber in bezug auf sein Wollen auch bei Tage. Daß man das eigene Ich nur negativ wahrnehmen kann, ermög- licht, das Ich des anderen Menschen wahrzunehmen. Ihn nehmen wir durch unser Wollen wahr; er wiederum schläfert uns für einen Augenblick ein. Dieses Hin- und Hervibrieren ist das Urelement des sozialen Zusammenlebens von Mensch zu Mensch. Die alten Formen der Bluts- und Volkszusammenhänge müssen überwunden werden. Seit der Reformation drei Etappen: Herrschaft des öko- nomischen Menschen, des Bankiers und des Kapitals. Jetzt muß eintreten soziales Verständnis, das für die nächste Inkarnation Ver- ständnis für Karma schafft, das heißt Verständnis für das Schicksal des einzelnen Menschen."
