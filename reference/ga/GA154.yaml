  - seq: 2
    ga: 154
    type: vortrag
    datum: 18.04.1914
    ort: Berlin
    titel: "Wie erwirbt man sich Verständnis für die geistige Welt? (I) Vom Wesen des Traumes. Über die Halluzination. Äthersubstanz und verstärkte Seelenkraft. Vom okkulten Schreiben. Gewöhnliches und übersinnliches Denken, Die alten Religionsstifter und die neuere Gei- steswissenschaft. Das Wesen des Christus. Weiteres über den Traum. Das Wesen des Astralleibes. Die Ich-Vorstellung als Schwerpunkt des Geist-Erlebens. Atavistisches Hellsehen und gesundes Urteilen. Klare Vorstellungen als Bedingung zur Geisteswissenschaft."
  - seq: 3
    ga: 154
    type: vortrag
    datum: 26.04.1914
    ort: Berlin
    titel: "Robert Hamerling, ein Dichter und ein Denker und ein Mensch"
  - seq: 4
    ga: 154
    type: vortrag
    datum: 05.05.1914
    ort: Basel
    titel: Die Erweckung spiritueller Gedanken als Zeitforderung Über den Schlaf. Der Gegensatz von Blut und Nerven und dem übrigen Organismus im Schlaf. Bazillen und Gespenster. Wesen der Bazillen. Spirituelle Gedanken als Nahrung für die Toten. Über- windung des Egoismus im Verhältnis zu den Toten. Über den Tod eines Freundes (Christian Morgenstern). Die Religionsstifter und ihre Bedeutung. Das Mündigwerden der modernen Menschheit. Die Christus-Tat. Das Wesen der äußeren Welt. Der tiefere Gedanke des Dornacher Baues. Die Entwickelung des Denkens als Aufgabe unse- rer Zeit. Ausschluß eines Mitgliedes und die Begründung dieses Vor- gehens.
  - seq: 5
    ga: 154
    type: vortrag
    datum: 12.05.1914
    ort: Berlin
    titel: "Wie erwirbt man sich Verständnis für die geistige Welt? (II) Johann Gottlieb Fichtes Verhältnis zur geistigen Welt und zu seiner menschlichen Umwelt. Unterschied von sinnlichem und geistigem Wahrnehmen. Das Schicksal einer befreundeten Persönlichkeit (Ma- ria von Strauch-Spettini) und ihr Aufsteigen zum Schutzgeist der Mysteriendramen. Der verstorbene Dichterfreund (Christian Mor- genstern) und sein Wesen im Leben nach dem Tode. Die Darstellung des Dornacher Baues in der Weltpresse. Die Bildung des Urteils aus der Geisteswissenschaft selber heraus."
  - seq: 6
    ga: 154
    type: vortrag
    datum: 25.05.1914
    ort: Paris
    titel: "Das hellsichtige Bewußtsein und der Traum. Verschiedenheit der Gestalt und der Handlungsweise beim Verstorbenen. Das Aneignen neuer Begriffe zum Verstehen der geistigen Welt. Eine verstorbene Persönlichkeit (Maria von Strauch-Spettini) als Schutzpatronin der Mysterienaufführungen. Die Jungfrau von Orleans. Vom Erleben der Angeloi (Milde) und der Archangeloi (Stärke). Das \"Wesen eines verstorbenen Dichterfreundes (Christian Morgenstern) nach dem Tode. Das Erleben der geistigen Welt. Angeloi, Archangeloi, Luzifer und Ahriman. Wandlung der Erlebnisse in der physischen und gei- stigen Welt. Die Bereicherung des Vorstellungslebens. Wesen des Dornacher Baues. Die Grundsubstanz der anthroposophischen Bewe- gung. Die Eröffnung des Baues."
  - seq: 7
    ga: 154
    type: vortrag
    datum: 26.05.1914
    ort: Paris
    titel: "Intelligenz und hellsichtiger Forschung Geisteswissenschaft als «geistige Chemie». Konzentration und Me- ditation. Das Wahrnehmen des inneren Wortes. Illusion und Selbst- erkenntnis. Das Wesen der Begegnung mit Verstorbenen. Befruch- tung des eigenen Fühlens und Wollens durch eine verstorbene Freun- din (Oda Waller). Die Verselbständigung des Denkens. Ausbildung der Logik in der hellsichtigen Erkenntnis. Die Konkordanz zwischen Intelligenz und Hellsehen. Räumliches und zeitliches Firmament, ihre Durchstoßung bei Giordano Bruno und in der Geisteswissen- schaft. Grenzen des Erkennens und ihre Widerlegung. Das Wesen der Geisteswissenschaft als Zusammenfassung von Wissenschaft, In- telligenz und hellsichtiger Forschung."
