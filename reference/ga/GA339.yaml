    ort: —
    titel: "Über die zweifache Durchdringung des Redestoffes: Komposition der Rede, Zu-Rate-Ziehen aller Erfahrungen aus dem unmittelbaren Leben. - Ein dritter Gesichtspunkt: die Ideen so ausarbeiten, daß sie zur inneren Befriedigung vor der Seele stehen können. Anknüpfen an das Publikum und an das, was in der Gegenwart über die drei Glieder des sozialen Orga- nismus bemerkt werden kann. Über die Diskussionsredner. Die Begriffe sind aus den Erfahrungen des proletarischen Empfindens zu entwickeln. Über den Ideologiecharakter des Geisteslebens am Beispiel von Franz Mehrings «Lessing-Legende». Ideologie, Klassenbewußtsein, Mehrwert, Arbeitskraft. Vom Intellektualismus und dem Abstrakten im sozialen Leben. Über die Empfindungen der Bourgeoisie. Zusammenfassung und Schlußfolgerung."
