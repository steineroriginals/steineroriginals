    ga: 68a
    type: vortrag
    datum: 07.12.1908
    ort: Bremen
    titel: "Der große Einfluss der Bibel auf die abendländische Kul­ tur. Änderung des Standpunkts gegenüber der Bibel durch Bibelkritik und Wissenschaft. Vergleich mit dem Verhält­ nis zu Aristoteles im Mittelalter und der Neuzeit. Wie zu Aristoteles kann auch zur Bibel ein neues Verhältnis ge­ funden werden. Entwicklung der Seclenkräftc durch die Theosophie. Beispiel: die Rosenkreuz-Übung. Die vier Wesensglieder des Menschen. Erklärung der zwei Schöp­ fungsgeschichten in der Genesis und der Verschiedenheit der vier Evangelien. Vier mögliche Standpunkte gegenüber der Bibel. Wiedereroberung der Bibel durch Theosophie. Der Apostel Paulus und die Theosophie"
