    datum: 27.11.1906
    ort: Düsseldorf
    titel: "Bedeutung des Namens «Luzifer». Dualismus in allen Le­ bensgebieten. Gut und Böse. Beispiel «Faust». Verstehen des Bösen durch vertiefte Einsicht in Menschenwesen und Weltentwicklung. Fortgeschrittene und zurückgebliebe­ ne Wesen. Letztere bringen dem Menschen Enthusiasmus und Freiheit. Fragenbeantwortung: Sphinx und Pyrami­ den. Zweierlei «Schriften». Esoterisches Christentum"
