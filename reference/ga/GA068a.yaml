  - seq: 33
    ga: 68a
    type: vortrag
    datum: 24.05.1907
    ort: München
    titel: "religiösen Bedürfnissen weiter Volkskreise. Früheres und heutiges Verhältnis zur Bibel. Ergebnisse der Bibelwissen­ schaft. Theosophie als Brücke zwischen Wissenschaft und Religion. Überwindung der Erkenntnisgrenzen durch geis­ tige Entwicklung. Vier Stufen des Bibelverständnisses: na­ ives, aufgeklärtes, symbolisches, wieder wörtliches - theo­ sophisches. Vergleich mit dem Verhältnis der Wissenschaft des Mittelalters und der Neuzeit zu Aristoteles. Der goe- thische Aufsatz «Die Natur» und die Frage der geistigen Autorschaft. Die Stufen der geistigen Erkenntnis. Neues Bibelverständnis. Bibel und Weisheit II"
  - seq: 34
    ga: 68a
