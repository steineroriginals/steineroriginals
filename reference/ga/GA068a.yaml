  - seq: 39
    ga: 68a
    type: vortrag
    datum: 31.01.1908
    ort: Mainz
    titel: "Vorwürfe gegen die Geisteswissenschaft: Phantasterei, Entfremdung vom Leben. Mögliche Gefahren: Krank ma­ chende Wirkung der Theosophie durch Widerspruch zum Alltagsleben. Wenn man ungenügend vorbereitet ist, kann man Halluzinationen nicht von geistiger Wirklichkeit un­ terscheiden. Voraussetzungen: Furchtlosigkeit, Überwin­ dung negativer Gefühle. Der Hüter der Schwelle. Das Stre­ ben nach höherer Erkenntnis ist nicht egoistisch, sondern hat Bedeutung für die Menschheit. Religion, Wissenschaft und Theosophie"
