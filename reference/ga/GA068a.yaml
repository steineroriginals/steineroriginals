  - seq: 36
    ga: 68a
    type: vortrag
    datum: 14.12.1907
    ort: Düsseldorf
    titel: "Erklärung des langen Lebens der Urväter im Alten Tes­ tament. Die Offenbarung des Johannes. Bedeutung der Zahl 666. Augustinus über das Christentum als Urreligion. Stufen der Einweihung in den alten Mysterien. Beschrei­ bung der Einweihung. Das Leben Jesu Christi und die Mysterien. Vergleich: Das Verhältnis der Wissenschaft in Mittelalter und Neuzeit zu Aristoteles. Theosophie führt dazu, dass die Herzen der Lehrer und der Gläubigen wie­ der zusammenklingen. DAS JOHANNESEVANGELIUM UND DIE ZUKUNFT DES Christentums"
  - seq: 37
