  - seq: 6
    ga: 117
    type: vortrag
    datum: 14.11.1909
    ort: Stuttgart
    titel: "Ü b e r das rechte Verhältnis z u r Anthroposophie Vollendung des ersten siebenjährigen Zyklus im Leben der deutschen Sektion der Theosophischen Gesellschaft. Notwendigkeit der Mitteilung der Ergebnisse der Geisteswissenschaft vor der Entwicklung der höheren Fähigkeiten des geistigen Schauens und Prüfung dieser Ergebnisse durch das Denken, Visionäres Hellse- hen und die Fähigkeit des gründlichen Denkens. Warum man sich nicht an frühere Inkarnationen erinnert. Warum die Götter den Menschen haben entste- hen lassen. Wie ein denkender und ein nichtdenkender visionärer Hellseher die Erscheinungen der geistigen Welt sieht. Die Gedanken geben die Substanz her, das, was in der geistigen Welt ist, zu ergreifen. Einfachheit der Gehirnwindungen bei scharfen Denkern. Gefahren des visionären Hellsehens. Ausbildung der Urteilskraft und Rückerinnerung an die jetzige Inkarnation."
