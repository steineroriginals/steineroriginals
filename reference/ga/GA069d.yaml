    ga: 69d
    type: vortrag
    datum: 06.02.1912
    ort: Wien
    titel: Der Drang des Menschen nach Vervollkommnung und die Frage nach Tod und Unsterblichkeit. Der Sauerstoff im Wasser als Bild für das Leben der Seele im Leibe. Der Schlafzustand als Abtrennung des Geistig-Seelischen vom Leibe. Die Arbeit der Seele am Leibe an Beispielen. Der Traum des zeichnenden Schülers. Das Sprechen-Können. Nostradamus. Die Bedeutung der entwickelten geistig­ seelischen Kräfte für das Leben nach dem Tode. Tod und Unsterblichkeit im Lichte der Geisteswissenschaft
  - seq: 9
