  - seq: 10
    ga: 69d
    type: vortrag
    datum: 19.02.1912
    ort: Stuttgart
    titel: "Der Drang nach Vervollkommnung und die Frage nach der Unvergänglichkeit der Menschenseele. Ein Wort Hegels. Betrachtung des Traumzustandes im Hinblick auf die Ar­ beit der Seele am Leib. Beispiel der sich steigernden Fähig­ keit im Zeichnen, die sich in Träumen äußert. Entwicklung des Kindes aus dem Traumzustand zum Bewusstsein. Das Vorgeburtliche zeigt sich in Gemütsstimmung und Charak­ ter. Die Geistesforschung als geistiges Experiment. Sinn­ bildliche Vorstellungen. Werden und Vergehen, wiederhol­ te Erdenleben. Der Mensch und sein Verhältnis zu den ÜBERSINNLICHEN WELTEN"
