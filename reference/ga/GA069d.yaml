    ga: 69d
    type: vortrag
    datum: 04.10.1913
    ort: Kristiania (Oslo)
    titel: "Die Frage nach Tod und Unsterblichkeit als Lebens- und Schicksalsfrage und die Geisteswissenschaft. Egoistische und naturwissenschaftliche Anschauungen über Tod und Unsterblichkeit. Gibt es ein Bewusstsein, das unabhän­ gig vom Leibe ist? Betrachtung von Wachen und Schlafen. Wege zu einem Wachen im Schlaf: Bildliche Vorstellungen. Selbstsucht als Hindernis auf dem Schulungsweg. Selbst­ erkenntnis am Abgrund. Vererbungslehre und Wiederver­ körperung. Geisteswissenschaft als Lebenselixier. Das Rätsel des Todes"
