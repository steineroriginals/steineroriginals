    type: vortrag
    datum: 14.01.1910
    ort: —
    titel: "Die vorchristlichen Mysterien als Quellen zum Verständnis der Evan­ gelien. Nach Vorbereitung durch äußere Maßnahmen Einweihung in den Stufen der Imagination, Inspiration und Intuition, begleitet von Prüfungen zur Katharsis. Der katalcptischc Schlaf als letzter Schritt der eher südlichen Einweihung; in eher nördlichen Einweihungen das Hinausführen in den Tierkreis. Johannes der Evangelist als Lazarus in die südlichen Mysterien cingcwciht. Die Zeitangabe «zehnte Stunde* als Hinweis auf dessen Einweihung auch in die nördlichen Mysterien. Mit der Erweckung des Lazarus Auftreten des Einweihungsgesche­ hens vor die öffentliche Welt als Indiz für die Inkarnation des Welten­ wortes in Christus."
