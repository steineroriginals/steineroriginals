    datum: 11.01.1910
    ort: —
    titel: "Die Beschreibungen des Johannes-Evangeliums als solche geistigen Schauens. Beispiele hierfür: das Gespräch des Nikodemus mit Chris­ tus in der Nacht und die Schilderung des Geschehens bei der Jordan- Taufe. Das Aufschwingen des Jesus-Selbstbewusstseins zum Gottes- Bewusstsein als Inhalt des Johannes-Evangeliums. Die okkulte Bedeu­ tung von der «wahre Israelit* Nathanael und von Jesus als «König Israels*. Christus als der Bringer der Geistes-Liebe. Die I Hochzeit zu Kana als Beispiel der Kraft des Christus, auf die Sinncs-Empfindungen anderer Menschen zu wirken. Verwandlung der Maria zur Sophia durch Erhalt der Jungfrauschaft* vermittels des Einzuges der nathanischen Mutter in die salomonische Mutter."
