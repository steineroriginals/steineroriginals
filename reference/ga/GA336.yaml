    titel: "Ein Buch Professor Fritz Terhalles über Preisbildung. Preisbildung aus der Dreigliederung durch Schaffung von Vertrauensverhältnissen der be­ teiligten. Nationalwirtschaften und Welthandelsprinzip. Kriegsursache: Die Sprengung der Nationalwirtschaften durch den Welthandel. Assozi­ ationen. Kurt Leese über Anthroposophie. Kurze Schilderung der Geis­ teswissenschaft. Das unfreie und das freie Geistesleben. Die Dreigliede- rung. Inwiefern ist die Dreigliederung berufen, aus dem Chaos HERAUSZUFÜHREN?"
