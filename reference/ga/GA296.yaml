    type: vortrag
    datum: 16.08.1919
    ort: —
    titel: Die Erziehung als Lehrerbildungsfrage. Der Materialismus als Prüfung der Menschheit. Das Wiederfinden des Weges zum Geiste. Neuorien- tierung der Lehrerbildung durch Geisteswissenschaft. Der dreiglied- rige Mensch.
  - seq: 6
    ga: 296
    type: vortrag
    datum: 17.08.1919
    ort: —
    titel: "Die Metamorphosen der menschlichen Intelligenz. Der Ägypter erfaßte das Kosmische durch seine Intelligenz; der Grieche das Tote. In der Gegenwart hat die Intelligenz die Neigung, sich mit dem Bösen zu verbinden. Verwandlung der Intelligenzkräfte durch das Christus- Mysterium."
