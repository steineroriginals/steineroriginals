  - seq: 1
    ga: 127
    type: vortrag
    datum: 05.01.1911
    ort: Mannheim
    titel: "spiel für die Notwendigkeit, die Welt in jedem Zeitalter neu zu erfassen. Religion, Wissenschaft und soziales Leben müssen sich entsprechend dem Wandel der menschlichen Wesensglieder von Epoche zu Epoche ändern. Der in unserem Zeitalter notwendige Übergang vom Persönlichen zum Unpersönlichen zeigt sich in der Verfallsströmung im Loslösen des Geld- verkehrs von der Persönlichkeit und in der aufsteigenden Strömung im Hinwenden der Persönlichkeit zu den inspirierenden Mächten. Moder- ner Autoritätsglaube und Gespensterfurcht. Verquickung der Religion mit dem Dogma. Der mißverstandene Aristoteles. Geisteswissenschaft wird Führer zum religiösen Erleben, zum spirituellen Erarbeiten der Wis- senschaft und zu neuer Lebenspraxis. Theosophie und Antisophie. Ein Fichte-Wort."
  - seq: 2
    ga: 127
    type: vortrag
    datum: 07.01.1911
    ort: Wiesbaden
    titel: "Auswirkung moralischer Eigenschaften auf das Karma Bewahrheitung der Karmalehre im Alltagsleben. Neid geht auf luziferi- schen, Lüge auf ahrimanischen Einfluß zurück. Unterdrückter Neid wird in der gleichen Inkarnation zur Tadelsucht, unterdrückte Lügenhaftigkeit zur Scheuheit. Im nächsten Erdenleben sind leibliche Mängel die Folge. Staunen - eine Funktion des Astralleibes. Die richtige Gemütsstimmung des Erziehers. Ursachen langer Jugendlichkeit und früher Greisenhaftig- keit. Das Märchen vom Storch ist Bild einer Realität."
  - seq: 3
    ga: 127
    type: vortrag
    datum: 08.01.1911
    ort: Frankfurt
    titel: "Verstandesseele und Empfindungsseele. Wo wir zur Umwelt in Bezie- hung treten, werden wir von den Geistern der Persönlichkeit durchkraf- tet. Luziferische Wesenheiten wirken den Engeln, ahrimanische den Erz- engeln entgegen. Ohne Widersachermächte könnte der Mensch keine Freiheit entwickeln. Nach der Bewußtseinsseele sollen auch die Verstan- desseele und Empfindungsseele reif zur Freiheit werden. Moralische Ver- antwortung der Mitglieder einer spirituellen Bewegung."
  - seq: 4
    ga: 127
    type: vortrag
    datum: 11.02.1911
    ort: München
    titel: "Leib in der ägyptischen Kulturepoche ermöglichte das Einströmen von Kräften höherer Wesenheiten. Das Äußere des Menschen war ein Ab- druck seiner Seele. Einklang der Schönheit der Seele und des Körpers im Griechentum. In der Zukunft muß der Mensch bewußt Kräfte aus dem Geistigen herausholen. Wandel der Kindesgestalt. Die Kunst der Grie- chen und die Kunst der Zukunft. Notwendigkeit der Aufnahme spirituel- ler Ideen. Die Arbeit des Ich an den Hüllen in den ersten Lebensjahren. Weisheit der Kindheitsseele in der urindischen Epoche. Der geistig-see- lische Mensch der ersten drei Lebensjahre ist der Gottessohn, der Träger des Ich-Bewußtseins der Menschensohn. Der Zerfall der Erde entspricht dem Vertrocknen des physischen Menschenleibes. «Das Antlitz der Erde» von Eduard Sueß."
  - seq: 5
    ga: 127
    type: vortrag
    datum: 23.02.1911
    ort: Basel
    titel: "Geduld, Weisheit, Frömmigkeit, Lebenssicherheit. Weisheit, Frömmigkeit und Lebenssicherheit"
  - seq: 7
    ga: 127
    type: vortrag
    datum: 25.02.1911
    ort: Zürich
    titel: "Die Arbeit des Ich am Kinde. Ein Beitrag zum Verständnis der Christus-Wesenheit Das Ich plastiziert in den ersten drei Lebensjahren unter Leitung höherer Wesenheiten das Gehirn aus. Mit dem Bewußt werden des Ich erlischt sei- ne Verbindung zur geistigen Welt. Die Zweiheit von Gottessohn und Menschensohn. Die Schädelform, ein Ergebnis früherer Inkarnationen. Belebung der Kräfte des Gottessohnes im späteren Lebensalter. Heilen durch Handauflegen. Der Zusammenhang zwischen dem Gottessohn im Menschen und dem Christus-Ereignis. Der tiefere Sinn biblischer Sprü- che. Drei Unterschiede des Menschen zum Tier. In dem Täufer Johannes als Vorläufer des Christus Jesus lebte ein Engelwesen. Die Erde als Leib der Menschheit."
  - seq: 8
    ga: 127
    type: vortrag
    datum: 26.02.1911
    ort: —
    titel: St Gallen
  - seq: 9
    ga: 127
    type: ansprache
    datum: 03.03.1911
    ort: Berlin
    titel: Ansprache nach einer Aufführung der «Hebriden-Ouvertüre» von Mendels- sohn
  - seq: 10
    ga: 127
    type: vortrag
    datum: 06.03.1911
    ort: Bielefeld
    titel: "Die Bedeutung der Geistesforschung für das sittliche Handeln Durch unmoralisches Handeln schädigt der Mensch nicht nur sich selber, sondern die Menschheit als Ganzes. Die Einsicht in die Zugehörigkeit des Menschen zum Erdorganismus ist ein ungeheurer sittlicher Impuls. Mit dem Überhandnehmen des materialistischen Bewußtseins wächst die An- tipathie gegen bloßes Moralpredigen. Christus als das Menschen-Urbild. Physische Folgen von Unmoralität und Widersetzlichkeit gegen den Christus auf dem Jupiter. Von wahrer Weisheit strahlt Moralität aus."
  - seq: 11
    ga: 127
    type: vortrag
    datum: 28.03.1911
    ort: Prag
    titel: "Aphorismen über die Beziehung von Theosophie und Philosophie Die Notwendigkeit präziser philosophischer Formulierungen. Während sich die heutige Philosophie im Abstrakten bewegt, schlägt die Theoso- phie eine Brücke vom Geistigen zum Tatsächlichen. Begriffe, die an der äußeren Wahrnehmung gebildet werden, müssen sich mit den Begriffen, die aus der geistig-übersinnlichen Wahrnehmung gewonnen werden, auf dem Begriffsfelde treffen. Der Bezug des Bewußtseinsinhaltes zur Reali- tät. Das Ich ist umfassender als die Sphäre der Subjektivität. Der Satz, es könne nichts von dem Transsubjektiven in das Subjektive hineinkom- men, hat nur eine begrenzte Geltung. Maskierter Materialismus in der konventionellen Erkenntnistheorie. Die Pflicht zum Erkennen. Eine Sonderbetrachtung zu den Vorträgen über «Okkulte Physiologie»"
  - seq: 12
    ga: 127
    type: vortrag
    datum: 03.05.1911
    ort: München
    titel: "Erbsünde und Gnade Fast alle traditionellen Religionen haben ihre wahren Tiefen verloren. Der Mensch erlag der luziferischen Verführung vor dem Einzug des Ich. Durch das Schuldigwerden des Astralleibes sank er in der folgenden Ich- Entwicklung immer tiefer. Fortwirken des luziferischen Einschlags in der Vererbung. Die von der Weltenordnung zugelassene Erbsünde ließ den Menschen aus den geistigen Höhen in das physisch-materielle Dasein her- absteigen, damit er sich zu einem freien Wesen entwickeln kann. Die Per- sönlichkeit, in der einerseits die astralen Triebe, anderseits abstrakte Ideen leben, muß wieder zum Geistigen hinaufstreben, wo sie von einem höheren Persönlichen, dem Christus-Impuls erfüllt wird. Die Gnade wird so zum Äquivalent der Erbsünde."
  - seq: 13
    ga: 127
    type: vortrag
    datum: 05.06.1911
    ort: Kopenhagen
    titel: "Die Mission der neuen Geistesoffenbarung Sehnsucht nach wahrer Selbsterkenntnis, Das Zeichen des Rosenkreuzes. Wahre und falsche Toleranz. Das Wissen von Reinkarnation und Karma im Lebensgeschehen. Vom Sinn der wiederholten Erdenleben. Die nur intellektuelle Erkenntnis muß von spiritueller Einsicht abgelöst werden. Das Christus-Ereignis als einmaliger Schwerpunkt der Evolution. Die Gefahr des Irrtums und die sieghafte Kraft der Wahrheit. Einleitende Worte zu dem Zyklus «Die geistige Führung des Menschen und der Menschheit»"
  - seq: 14
    ga: 127
    type: vortrag
    datum: 14.06.1911
    ort: Wien
    titel: "Glaube, Liebe, Hoffnung Sokrates nannte die Tugend lehrbar. Die Erdenvergangenheit und die Ver- gangenheit der Menschheit in ihrer Dreiheit. Das Ich ist die Gegenwart des Menschen. Die Zukunft des Menschen. Den drei seelischen Grund- kräften entspricht die Dreiheit von Glaube, Liebe, Hoffnung. Der Mensch bleibt mit seinen Taten verbunden. Die Idee der wiederholten Erdenleben in Lessings «Erziehung des Menschengeschlechts». Die Wahrheiten der Geisteswissenschaft - eine lebendige Nahrung der Menschenseele."
  - seq: 15
    ga: 127
    type: vortrag
    datum: 30.11.1911
    ort: Heidenheim
    titel: Notizen aus einem Vortrag zur Einweihung des Zweiges Heidenheim
  - seq: 16
    ga: 127
    type: vortrag
    datum: 19.12.1911
    ort: Berlin
    titel: "Symbolik und Phantasie mit Bezug auf das Mysterium «Die Prüfung der Seele» Der Übergang im bisherigen Leben des Capesius zu einer spirituellen Anschauung. Das Märchen vom Quellenwunder. Die Welt des Märchens als Zwischenglied zwischen Hellsehen und Verstandeswelt. Das Märchen von der klugen Katze als Beispiel für die Welthistorik der Märchenstim- mung. Das imaginative Hellsehen der Vorzeit. Die dichterische Form der Verstandes- oder Gemütsseelenkultur ist der Endreim, diejenige der wil- lensbetonten Empfindungsseelenkultur der Stabreim. Jordans «Nibe- lunge», ein Versuch zur Erneuerung alter Zustände. Die Sprache muß auf ihren Ursprung, das imaginative Erkennen, zurückgeführt werden."
  - seq: 17
    ga: 127
    type: vortrag
    datum: 21.12.1911
    ort: Berlin
    titel: "6. Januar zur Erinnerung an die Geburt des Christus in dem Jesus von Nazareth gefeiert. Mit dem Dahinschwinden des alten Wissens trat im 4. Jahrhundert an die Stelle des Erscheinungsfestes das Jesus-Geburtsfest. In dem Jesusknaben des Lukas-Evangeliums lebte eine Seele, die am Ab- stieg der Menschheit nicht teilgenommen hatte. Der Zusammenhang des «Adam-und-Eva-Tages» mit dem Jesus-Geburtsfest. Die geistig-kosmische Bedeutung der Heiligen Nachte."
  - seq: 18
    ga: 127
    type: vortrag
    datum: 26.12.1911
    ort: Hannover
    titel: "Die Geburt des Sonnengeistes als Erdengeist Der Weihnachtsbaum, ein Symbol des inneren geistigen Lichtes. «Jeri- cho» und «das Durchschreiten des Jordans» symbolisieren Stufen der Ein- weihung. Die Gnostiker durchschauten noch das Christus-Mysterium. In der Verlegung des Christgeburtsfestes vom 6. Januar auf den 25. Dezem- ber waltete unbewußte Weisheit: Statt des Erscheinens des Gottes im Menschenleibe wurde fortan die Verkörperung der aus göttlich-geistigen Höhen herabgestiegenen unschuldvollen Menschenseele gefeiert. Das Durchleben der dreizehn Nächte im Traumlied des Olaf Ästeson."
