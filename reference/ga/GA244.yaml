    titel: "I. Bericht des Dr. Rudolf Steiner, Schriftsteller, Sohn des Johann, geb. 27. Februar 1861, von Geras Nieder-Österreich, wohnhaft in Dornach."
    beschreibung: "Amtliche Untersuchung des Brandes des Goetheanums in der Silvesternacht vom 31. Dezember 1922, Januar 1923. Siehe dazu die Dokumentation: «Zum Brandgeschehen. A. Offizielle Dokumente, B. Zeitungsberichte», in: Das Schicksalsjahr 1923 in der Geschichte der Anthroposophischen Gesellschaft, GA 259, 1. Aufl. Dornach 1991, S. 747-793. — Man beachte, dass es sich bei den nachfolgenden Texten nicht um publizierte Interviews handelt, sondern um amtliche Protokolle von Gesprächen. Textgrundlage: «Branduntersuchung, Goetheanum, Dörnach 1923» (Standort des Originals: Staatsarchiv Solothurn (StASO), Akzession 2014/4, Akten der Kriminaluntersuchung nach dem Brand des Goetheanums in Dörnach (1923)), Sp. 9, S. 15-16 [handschriftlich S. 12-13] und S. 195-199 [handschriftlich S. 36-40]. Kopie: RSA Standort-Nr. 066/2."
