    ga: 244
    type: vortrag
    datum: 02.06.1922
    ort: Wien
    titel: Der Kongress der Anthroposophie. Ein Gespräch mit Dr. Rudolf Steiner
    beschreibung: "Interview («Neues Wiener Tagblatt», 2. Juni 1922). Kontext: Der Herausgeber Wolfgang Vögele der unten angegebenen Textsammlung schreibt zu diesem Interview: «Während des zweiten internationalen Kongresses der anthroposophischen Bewegung (dokumentiert in: Westliche und östliche Weltgegensätzlichkeit, GA 83), der in den Pfingsttagen 1922 [1. bis 12. Juni] in Wien unter dem Motto «Zur Verständigung westlicher und östlicher Weltgegensätzlichkeit» tagte, gab Rudolf Steiner im Hotel «Imperial» am Kärntner Ring (1. Stock, Zimmer 5), nicht nur unzählige Audienzen; er empfing [unter anderem] auch Korrespondenten des «Neuen Wiener Tagblattes».» Siehe auch das vorangehende Interview. Textgrundlage: «Neues Wiener Tagblatt», 2. Juni 1922. Kopie, RSA Standort-Nr. 176/3. Bisherige Veröffentlichungen: «Dreigliederung des sozialen Organismus», 3. Jg., Nr. 49, 8. Juni 1922, S. 6; W. Vögele (Hrsg.): Der andere Rudolf Steiner, 2. Aufl. Basel 2005, S. 314-316."
