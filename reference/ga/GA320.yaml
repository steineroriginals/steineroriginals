  - seq: 3
    ga: 320
    type: vortrag
    datum: 24.12.1919
    ort: —
    titel: "Drei Forschungsrichtungen der gewöhnlichen Naturwissenschaft. Im Gegensatz dazu Goethes Methode. Stellung der Mathematik: Phoronomie und Mechanik. Zentralkräfte mit Potential - peri- pherische Universalkräfte ohne Potential."
  - seq: 4
    ga: 320
    type: vortrag
    datum: 25.12.1919
    ort: —
    titel: Überbrückung der Kluft zwischen Phoronomie und Mechanik. Auftrieb des Gehirns. Gegensatz von Masse und Licht im Ver- hältnis zum Bewußtsein. Entstehung der Farben durch das Prisma. Gegensatz von Muskel und Auge im Verhältnis zum Astralleib.
  - seq: 5
    ga: 320
    type: vortrag
    datum: 26.12.1919
    ort: —
    titel: "Goethes erster Versuch mit dem Prisma. Farben als Rand- erscheinungen. Doppelprisma, Sammellinse, Zerstreuungslinse. Verengung oder Weitung des Lichtkegels anstatt gebrochener Lichtstrahlen. Hebung, Visierkraft des Auges. Organisation des Auges."
  - seq: 6
    ga: 320
    type: vortrag
    datum: 27.12.1919
    ort: —
    titel: Urphänomen der Farbenlehre. Subjektives Spektrum. Newtons Vorstellung der Lichtkorpuskeln. Fresnelscher Versuch. Undula- tionstheorie. Lichtauslöschung durch die Natriumflamme. «Zer- legung » der Dunkelheit.
  - seq: 7
    ga: 320
    type: vortrag
    datum: 29.12.1919
    ort: —
    titel: "Kirchhoff-Bunsenscher Versuch. Phosphoreszenz, Fluoreszenz, Körperfarben. Gegensätzliches Verhältnis des Menschen zu Raum und Zeit einerseits, zur Geschwindigkeit andererseits; zu Licht und Farbe."
  - seq: 8
