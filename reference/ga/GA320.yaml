  - seq: 10
    ga: 320
    type: vortrag
    datum: 02.01.1920
    ort: —
    titel: "Ton und Schwingung. Die Geschwindigkeit als das Reale. Ist der Ton subjektiv? Die Sympathie der Erscheinungen. Die Organisation des Gehörsinnes: Leier des Apoll. Erst mit dem Kehlkopf zusammen wird das Ohr ein Ganzes, dem Auge ver- gleichbar. Beziehung des Tones zur Luftschwingung."
  - seq: 11
    ga: 320
    type: vortrag
    datum: 03.01.1920
    ort: —
    titel: "Erscheinungen der Elektrizität. Streben des 19. Jahrhunderts nach einem abstrakten Gleichen in den verschiedenen Naturkräften. Hertzsche Wellen als Krönung davon. Das revolutionierende Phänomen der Kathodenstrahlen. Ihre Modifikation: Röntgen- strahlen, et-, ß-y y-Strahlen. Wachen und Schlafen, Denken und Wille, Licht und Elektrizität. In Elektrizität und Magnetismus studiert man die Materie konkret."
