  - seq: 2
    ga: 150
    type: vortrag
    datum: 14.03.1913
    ort: Augsburg
    titel: "Vom Gebrauch anthroposophischer Wortbestimmungen. Die Ent- wickelung des Kindes. Luziferische Einwirkung in den ersten sieben Jahren. Ich-Bewußtsein, Gedächtnis, Egoität. Ahrimanische Ein- flüsse im zweiten Jahrsiebent. Die Verdichtung des Ich-Gefühls im neunten Jahr. Die Furcht vor der eigenen Gestalt. Das Zusammen- wirken der fortschreitenden Kräfte mit den luziferisch-ahrimani- schen Wirkungen zur inneren Selbständigkeit des Kindes. Gesunde Umgebung, Autorität, Begeisterung für Ideale als Grundprinzipien der Pädagogik. Das Gedächtnis. Über die Zähne. Das Alter. Seelen- sommer und Seelenwinter. Luziferisches und Ahrimanisches im Le- ben des Menschen. Die Unterscheidung von sinnlicher und übersinn- licher Welt als Aufgabe. Einige Worte zur Einweihung des Zweiges."
  - seq: 3
    ga: 150
