    datum: 16.11.1923
    ort: Den Haag
    titel: "Prinzipielles zur medizinischen Arbeit. Studien über Milzfunktion und zur Wirksamkeit kleinster Entitäten. Neue Erkenntnismethoden durch Entwickelung von Seelenfähigkeiten. Erkenntnis von phy- sischem, ätherischem, astralischem Leib und Ich. Zusammenwirken der vier Glieder. Diagnose und Heilung. Außermenschliche und in- nermenschliche Prozesse. Catarrhus aestivus. Einswerden von Patho- logie und Therapie. Cichorium intybus. Anlsum."
