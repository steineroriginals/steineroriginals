    ort: Leipzig
    titel: "«Generosität». Rcnans Erlebnis des deutschen Volkscha­ rakters. Das «Testament Peters des Großen». Vollständige Tolstoi-Herausgabe durch Löwenfeld. Das russische Welt­ bild: «Vom anderen Ufer» von A. I. Herzen; «Der eng­ lisch-russische Konflikt» von S. N. Jushakow; Panasiatis- mus; Solowjows Kritik an Danilewski; Slawophilentum. Carneri. Rostands «Chantecler». Hobbes’ «Macht geht vor Recht». D’Annunzios «heiliger Egoismus». Gedichte von K. J. Schröer zum deutschen Volkswesen. Zur deutschen Gedankenentwicklung. Ein VERGESSENES STREBEN NACH GEISTESWISSENSCHAFT INNERHALB DERSELBEN"
