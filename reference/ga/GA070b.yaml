  - seq: 9
    ga: 70b
    type: vortrag
    datum: 15.02.1916
    ort: Hamburg
    titel: "Gefahr des Utilitarismus in der Naturwissenschaft, Ge­ fahr des Narzissmus in der Geisteswissenschaft. Schwär­ merei, Lebensfaulheit, Lebenslässigkeit. Missverständnis­ se gegenüber der Geisteswissenschaft und gegenüber dem Dornacher Bau (Erstes Goetheanum): Weder mystischer Symbolismus, noch Allegorie, noch Aberglauben, sondern lebendige Kunst. Inaugurationsrede von L. Müllner: Ver­ tiefung der Religion durch Wissenschaft. Haeckels «Psy- chom». Harmonie von Natur- und Geisteswissenschaft. Das Weltbild des Deutschen Idealismus. Eine Betrachtung im Hinblick auf unsere schicksaltragende Zeit"
