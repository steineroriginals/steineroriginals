  - seq: 8
    ga: 105
    type: vortrag
    datum: 12.08.1908
    ort: —
    titel: Die Entwickelung der Menschen mit ihrer bildsamen Leiblichkeit während der lemurischen Epoche. Das allmähliche Abstoßen der höheren Tierformen in der menschlichen Entwickelung. Die gei- stige Wiederholung dieser Lebenstatsache im Ägyptertum. Die Fischform der Menschengestalt als Nachklang der Wirkung der mit der Erde noch verbundenen Sonnenkräfte. Das Fischsymbolum als Erinnerungszeichen in den Mysterien. Die Schlangenform der Men- schengestalt als Erinnerung an den Tiefstand in der Menschheitsent- wickelung vor dem Mondenaustritt. Venus- und Merkurwesenheiten als Menschheitslehrer in der Atlantis. Die Gestalten der germani- schen und der griechischen Mythologie als Erinnerungen an die Atlantis.
  - seq: 9
    ga: 105
    type: vortrag
    datum: 13.08.1908
    ort: —
    titel: "Weltkörpern Die Abhängigkeit der Planetengestaltung von den auf ihm sich ent- wickelnden Wesenheiten. Der Aufstieg der Sonne zum Fixstern und die materiellen Lebensbedingungen auf der Erde als Grundlage für die individuelle Entwickelung der Menschen. Das ausgleichende Wirken des Christus als geistige Sonnenkraft auf der Erde. Die Einverleibung der Weisheit als Harmonisierung auf dem alten Mond. Die Überwindung der Gruppenseelenhaftigkeit und Entwickelung der Liebe in immer höherer Art als Mission des Erdendaseins. Das Christus-Prinzip als Anstoß zur Wiedervereinigung der Erde mit der Sonne. Die esoterische Bedeutung des Kreuzes. Der Mensch als Erden-, Sonnen- und Weltallwesen. Die höheren Bewußtseinsstufen."
