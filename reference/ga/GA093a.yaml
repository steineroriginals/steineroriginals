    ort: Berlin
    titel: Vorbemerkung des Herausgebers 13
  - seq: 2
    ga: 93a
    type: vortrag
    datum: 27.09.1905
    ort: —
    titel: "Bedeutung des Schlangensymbols. Wirbellose und Wirbeltiere. Sonnengeflecht und Rückenmarkssystem. Innere Betrachtung des Menschen mit Hilfe des Kundalinifeuers. Zwölf Bewußtseins- stufen: sieben des Menschen, fünf der schaffenden Götter. Die zwölf Apostel als die zwölf vom Christus durchlaufenen Bewußt- seinsstufen."
  - seq: 3
    ga: 93a
    type: vortrag
    datum: 28.09.1905
    ort: —
    titel: "Tätigkeit, Weisheit, Wille: drei Leitvorstellungen in der Esoterik. Das Leben nach dem Tode. Das Auftreten des Hüters der Schwelle als Doppelgänger. Die Bedeutung von Christi Sühnetod. Ulfilas Einfluß auf die deutsche Sprache. Das Chaos der Tätigkeit des Westens und die Ruhe der Weisheit des Ostens."
  - seq: 4
    ga: 93a
    type: vortrag
    datum: 29.09.1905
    ort: —
    titel: "Bewußtseinsstufen der drei Naturreiche und des Menschen. Die Pflanzenwelt als Sinnesorgan der Erde. Das Orientierungsorgan an der Pflanzenwurzel und das entsprechende Orientierungsorgan im menschlichen Ohr. Das Kreuz als Symbol für die Entwickelungs- richtung von Mensch, Tier und Pflanze. Das Bewußtsein der Pflan- zen auf dem Mentalplan; jenes sensitiver Pflanzen, Idioten und Tiere auf dem Astralplan; der Mineralien auf dem höheren Mental- plan. Das Bewußtsein des Menschen auf dem physischen Plan und seine Entwickelung zu höheren Bewußtseinsstufen. Das Sphinx- rätsel als Hinweis auf die zukünftige Gestalt des Menschen."
  - seq: 5
    ga: 93a
    type: vortrag
    datum: 30.09.1905
    ort: —
    titel: Vom Bewußtsein der Bienen und der Ameisen. Alchimie und der Stein der Weisen. Das Verhältnis der Naturreiche zueinander. Das Wesen des Menschen der Zukunft.
