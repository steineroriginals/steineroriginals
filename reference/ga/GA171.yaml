    ort: —
    titel: Auslese der Passendsten. Gegensatz dazu Kropotkins Prinzip der gegen- seitigen Hilfeleistung. H. P. Blavatsky zwischen östlichen und westlichen Beeinflussungen.
  - seq: 12
    ga: 171
    type: vortrag
    datum: 15.10.1916
    ort: —
    titel: "Polarität zwischen westlicher und östlicher Kultur in Europa. Westliches Glücks- und östliches Erlösungsstreben. Neue Erkenntnisse: Urphänome- ne und freie Imaginationen. Bourgeois und Pilger. Calderons «Wunder- tätiger Magus» und Goethes «Faust»."
  - seq: 13
    ga: 171
    type: vortrag
    datum: 21.10.1916
    ort: —
    titel: "Auseinandergehen des Lebensäthers und des erdigen Elements in der menschlichen Organisation. Im Westen: Beobachtung von Verwandlung und Geburt, Streben nach Glück und Nützlichkeit. Osten: Aufsuchen des Bösen und des Leidens, Hinlenkung auf den Tod, Suche nach Erlö- sung und Befreiung. Das «Büro Julia». Spiritismus; Freuds Psychoanalyse; Laurence Oliphant; H. P. Blavatsky; Ku Hung Ming. Pol der Utilität, Pol des Sakramentalismus. Bourgeois und Pilger. Blavatskys Persönlichkeit."
  - seq: 14
    ga: 171
    type: vortrag
    datum: 28.10.1916
    ort: —
    titel: Episodische Betrachtung. Versiegen der Goetheschen Anschauung des in der Sinneswelt verborgenen Geistigen im 19. Jahrhundert. Haeckels bio- genetisches Grundgesetz. Weiterbildung Goethescher Anschauungen durch die Geisteswissenschaft. Kopf und übriger Organismus des Men- schen in der Entwicklung.
  - seq: 15
    ga: 171
    type: vortrag
    datum: 29.10.1916
    ort: —
    titel: Faust und der Erdgeist. Der Einfluß des Materialismus auf das Gedanken- leben im 19. Jahrhundert. Die Erforschung des Leblosen. Die Beobach- tungen von John Tyndall und Leconte. Die Theologie im Banne der Na- turwissenschaft. Die Verkennung der Anthroposophie durch Theologen.
