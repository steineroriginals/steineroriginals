    ort: München
    titel: "im neunzehnten Jahrhundert» und die Vorrede von Lord Haldane. Die Übertragung der Balkanmission an Öster­ reich auf dem Berliner Kongress und ihr Zusammenhang mit den gegenwärtigen Ereignissen. Herman Grimm über das deutsche Wesen. Die Kriegsschuldfrage. Die Vor­ geschichte des Krieges. Bismarcks Worte im Reichstag 1888 und ihre Anwendbarkeit auf das Jahr 1914. Maurice Maeterlinck über Novalis. Goethe: die Menschengestalt als Götterkunstwerk. Die Kraft zur Verjüngung. Die unsicht­ bare Kraft des deutschen Volkes im Sinne Schleiermachers. Die Menschenseele, das Schicksal und der Tod vom Gesichtspunkt der Geisteswissenschaft"
  - seq: 4
    ga: 70a
    type: vortrag
    datum: 15.02.1915
    ort: Stuttgart
    titel: "schengeschlechts». Erleben des Todes im Bild als Erfassen eines Lebens außerhalb des Leibes. Selbstbewusstes Sich- Erleben nach dem Tod durch den Blick auf einen Zeiten­ leib der Erinnerung. Der Tod als weckende Kraft für das übersinnliche Wesen des Menschen und für dessen Selbst­ bewusstsein. Notwendigkeit, ein geisteswissenschaftliches Denken zu entwickeln, Keime dazu bei Fichte. Die Bedeu­ tung des frühen, opfervollen Sterbens für eine Sache. Die Mitwirkung jung Verstorbener an der Gestaltung der kom­ menden, notwendig neuen Zeit. Warum nennen «sie» das Volk Fichtes und Schillers ein «Barbarenvolk»?"
