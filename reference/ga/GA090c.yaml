    datum: 13.10.1903
    ort: Berlin
    titel: Die sieben großen Erdengeheimnisse. Das Geheimnis von Geburt und Tod. Mitnehmen von Fähigkeiten - nicht der konkreten Ereignisse - in die nächste Inkarnation. Der Gedanke als lebendige Kraft. Die notwen­ dige Konstellation zur erneuten Verkörperung. Einige schnelle Wieder­ verkörperungen auch in der Theosophischen Gesellschaft. Goethes In­ karnation als Bildhauerschüler zu Platons Zeiten. Hinübertragen der Früchte der Entwicklung anhand der Erfahrungen im Körper. Schnelle Wiedergeburten aufgrund der falschen Körperwahl. Von der Einseitig­ keit bloß geradliniger Entwicklungen. Über den Ursprung des Bösen
