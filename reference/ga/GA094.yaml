  - seq: 33
    ga: 94
    type: vortrag
    datum: 09.07.1906
    ort: Leipzig
    reihe: gehalten in Leipzig vom 28. Juni bis 11. Juli 1906
    titel: "Der Wandel der Seelenverfassung im Durchgang durch die Kultur- epochen. Die Aufgabe der gegenwärtigen fünften und der sechsten Kultur. Unterschiedlicher Geltungsbereich des ptolemäischen und des kopernikanischen Weltsystems. Überwindung der Zwei- geschlechtigkeit. Die Phantasie. Magie des Wortes. Zwei Haupt- erfordernisse der okkulten Entwicklung: die große Einsamkeit und die Devotion."
  - seq: 34
