  - seq: 35
    ga: 94
    type: vortrag
    datum: 11.07.1906
    ort: Leipzig
    reihe: gehalten in Leipzig vom 28. Juni bis 11. Juli 1906
    titel: Der Stein der Weisen. Die Stufen der östlichen Schulung. Die christliche Einweihung und der rosenkreuzerische Schulungsweg. Die «Philosophie der Freiheit» und «Wahrheit und Wissenschaft» dienen der Ausbildung eines sinnlichkeitsfreien Denkens.
