  - seq: 11
    ga: 190
    type: vortrag
    datum: 13.04.1919
    ort: —
    titel: "Das Nibelungenzeitalter wird abgelöst von der mitteleuropäischen Bürgerzeit, die am Ende ihrer Entwickelung ist. Die mitteleuro- päischen Territorialfürsten und ihr Anhang leben in der Bürgerzeit den Nibelungen-Seelencharakter in Verfallswesenheit dar. Friedrich der Große und Goethe. Heinrich IV. und Walther von der Vogel- weide. Das Zusammenwirken des ahrimanischen Elementes des mo- dernen Industrialismus in Form von Technik und Kapitalismus, mit den Anhängern der in Verfall geratenen Nibelungenwildheit, brachte Mitteleuropa seinen Untergang. Das Überschreiten der Schwelle als Durchgang durch die Pforte des Todes."
  - seq: 12
    ga: 190
    type: vortrag
    datum: 14.04.1919
    ort: —
    titel: "Tendenz nach Dreigliederung des sozialen Organismus seit dem Ende des 18. Jahrhunderts im Unterbewußtsein der Menschheit. Die mitteleuropäische Bürgerzeit war durchpulst von Seele, der Geist fehlte. Weil man die sozialen Lebensbedingungen des Geistes in Mit- teleuropa nicht wahrnahm und das Geistesleben nicht auf sich selbst stellte, kam es zu katastrophalen Zuständen. An dem Erleben der geistlosen Naturwissenschaft muß seit der Mitte des 15. Jahrhun- derts der Geist geboren werden. Seit der Wende des 14. zum 15. Jahr- hundert kümmern sich die Seelen, die auf die Erde niedersteigen, weniger um das Rassenmäßige als um die geographischen Verhält- nisse. In Asien sprüht durch die Denkweise der Asiaten Licht, im Westen pulsiert Leben in den Weltenraum."
