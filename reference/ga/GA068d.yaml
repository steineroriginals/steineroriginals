    titel: "Ausbildung des Willens. Bedeutung der rechten Gesin­ nung. Die Puppe. Zweite Lebensepoche: Ätherleib. Aus­ bildung von Gedächtnis und Aufmerksamkeit. Dritte Le­ bensepoche: Astralleib. Heranbildung der Urteilskraft durch Ausbildung der Gefühlswelt. Selbstständigkeit des Menschen. Bedeutung der Umgebung für das neu gebo­ rene Kind. Fragenbeantwortung: Vererbungsverhältnisse. Erzieher als Beobachter. Nicht gewaltsam in die Erziehung des Kindes eingreifen. Hypnotismus und Spiritismus im Lichte der Theosophie"
