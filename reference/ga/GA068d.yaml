  - seq: 27
    ga: 68d
    type: vortrag
    datum: 08.01.1909
    ort: München
    titel: "Astralleib und Ich. Unterschiede beim Zusammenhang der Wesensglieder beim wachenden und schlafenden Men­ schen. Tod und Wiedergeburt. Vererbung und Individua­ lität. Wesensglieder und Vererbung. Das Temperament als Ergebnis der Anpassung des Ich an die vererbte Leibeshül­ le. Die vier Grundfarben der Temperamente: der melan­ cholische, phlegmatische, sanguinische und cholerische Mensch. Physische Ausprägung der Temperamente: Ge­ stalt und Gang. Zusammenwirken von Wechselndem und Ewigem im Menschen. Ein Wort Goethes. Ernährungsfragen im Lichte der Geisteswissenschaft"
