    datum: 29.06.1924
    ort: —
    titel: "naturhaften Geschehens mit dem Karmageschehen der Menschheit. Einwirkung des Karmaverlaufs auf die äußere Natur in Vulkanaus- brüchen, Erdbeben, Überschwemmungen und so weiter. Das Wir- ken der zweiten Hierarchie im Sonnenhaften. «Die Sonne um Mitter- nacht.» «Die Morgenröte im Aufgang.» Herausschwebend aus den Wesenheiten der zweiten Hierarchie wirkt die dritte Hierarchie auf der Erdfläche während des Menschenschlafes in unseren hinterlas- senen Gedankenspuren. In das Weben und Wesen der zweiten Hier- archie spielt hinein und schlägt durch bis in den abgewendeten Teil der Erde die erste Hierarchie, die mit der zweiten zusammenwirkt an unserem Ich und Astralleib. Imaginativ-bildliche Initiationsan- schauung im Kultus."
